<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de funciones · Mi sistema</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="wrap">

    <!-- ===================== CABECERA ===================== -->
    <header class="top">
      <div class="header-actions">
        <button id="btn-refresh" class="ghost">↻ Refrescar</button>
        <button id="btn-cleanup" class="ghost" title="Borra en Cloudinary los archivos que ya no usa ninguna función">🧹 Limpiar archivos</button>
        <button id="btn-new" class="primary">+ Nueva función</button>
      </div>
    </header>

    <!-- ===================== AVISO MODO DEMO ===================== -->
    <div id="demo-banner" class="demo-banner hidden">
      <span>⚠️</span>
      <span id="demo-banner-text"></span>
    </div>

    <!-- ===================== BARRA DE HERRAMIENTAS ===================== -->
    <div class="toolbar">
      <input id="search" class="search" type="text" placeholder="Buscar por título, descripción o estado…">
      <select id="filter">
        <option value="all">Todas</option>
        <option value="updated">Solo con Update</option>
        <option value="pending">Pendientes</option>
        <option value="done">Completadas</option>
      </select>
    </div>

    <!-- ===================== TABLA ===================== -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Función</th>
            <th>Progreso</th>
            <th>Vista</th>
            <th>Notas</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="task-rows"></tbody>
      </table>

      <div id="empty-state" class="empty-state hidden">
        <h3 id="empty-title">Todavía no hay funciones</h3>
        <p id="empty-text"></p>
        <button class="primary" onclick="document.getElementById('btn-new').click()">+ Crear la primera función</button>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL FUNCIÓN ===================== -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Nueva función</h2>

      <label class="field">
        <span>Título de la función</span>
        <input id="field-title" type="text" placeholder="Ej: Módulo de login">
      </label>

      <label class="field">
        <span>Descripción</span>
        <textarea id="field-desc" placeholder="Qué hace, qué falta, decisiones tomadas…"></textarea>
      </label>

      <div class="row">
        <label class="field">
          <span>Porcentaje de completado</span>
          <div class="range-field">
            <input id="field-progress" type="range" min="0" max="100" step="5" value="0">
            <output id="field-progress-value">0%</output>
          </div>
        </label>
        <label class="field">
          <span>Etiqueta de estado</span>
          <input id="field-status" type="text" placeholder="En progreso / Pendiente / Revisión">
        </label>
      </div>

      <div class="field media-editor">
        <span class="field-label">Vista</span>
        <div id="media-dropzone" class="dropzone" role="button" tabindex="0"
             title="Arrastra tus archivos aquí o haz clic para elegirlos">
          <div class="dropzone-hint">
            <span class="dropzone-icon">⬆</span>
            <span>
              <strong>Arrastra y suelta</strong> tus imágenes o videos aquí<br>
              <span class="meta-line" style="margin:0">o haz clic para elegirlos</span>
            </span>
          </div>
          <div id="media-editor"></div>
          <input id="media-file-input" type="file" accept="image/*,video/*" multiple hidden>
        </div>
      </div>

      <div class="modal-actions">
        <button id="btn-delete-task" class="danger hidden" type="button">Borrar función</button>
        <button id="btn-cancel" class="ghost" type="button">Cancelar</button>
        <button id="btn-save" class="primary" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <!-- Librería de Supabase (CDN). Si no hay internet, la app usa modo demo. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./config.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/cloudinary.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
